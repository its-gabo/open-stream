name: open-stream

x-logging: &default-logging
  driver: journald
  options:
    tag: "{{.Name}}"

x-api: &api
  image: ${REGISTRY:-ghcr.io/its-gabo}/open-stream-api:${TAG:-latest}
  restart: unless-stopped
  logging: *default-logging
  env_file: ${ENV_FILE:-.env}
  environment:
    DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/open_stream
    REDIS_URL: redis://redis:6379

services:
  db:
    image: postgres:16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: open_stream
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    <<: *api
    restart: "no"
    command: migrate
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *api
    command: server
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *api
    command: worker
    stop_grace_period: 2m
    volumes:
      - worker_tmp:/var/tmp/openstream
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    image: ${REGISTRY:-ghcr.io/its-gabo}/open-stream-web:${TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      API_INTERNAL_URL: http://app:3001
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    image: ${REGISTRY:-ghcr.io/its-gabo}/open-stream-nginx:${TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3080}:8080"
    depends_on:
      - web

volumes:
  db_data:
  redis_data:
  worker_tmp:
